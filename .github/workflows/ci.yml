name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          # Nightlies get dropped from the CDN after a while, so only latest is
          # reliably fetchable here.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          moon version --all

      - name: Fetch registry index
        run: moon update

      - name: Check formatting
        # The formatter's output drifts between nightlies, so this reports
        # rather than gating the build. Lint and tests below are what gate.
        continue-on-error: true
        run: |
          moon fmt
          git diff --exit-code

      - name: Type check
        run: moon check --deny-warn

      - name: Run tests
        run: moon test

      - name: Build the CLI
        run: moon build cmd/main