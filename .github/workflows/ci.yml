name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        env:
          # Pinned so a toolchain release cannot turn the build red on its own.
          MOONBIT_VERSION: 0.1.20261020
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          moon version --all

      - name: Fetch registry index
        run: moon update

      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code

      - name: Type check
        run: moon check --deny-warn

      - name: Run tests
        run: moon test

      - name: Build the CLI
        run: moon build cmd/main